on:
  push:
    branches: ["main"]
    paths:
      - "**/*.toml"
      - "**/*.lock"
      - "**.rs"
      - "**.wit"

jobs:
  publish:
    uses: wasco-dev/workflows/cd.yml@main
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit
